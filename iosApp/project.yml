name: DawnChat
options:
  bundleIdPrefix: com.chillboiostudios
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

targets:
  DawnChat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_NAME: DawnChat
        PRODUCT_BUNDLE_IDENTIFIER: com.chillboiostudios.dawnchat
        MARKETING_VERSION: 0.0.8
        CURRENT_PROJECT_VERSION: 8
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/bin/iosArm64/releaseFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosArm64/debugFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosX64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "DawnChatShared"
          - "-lsqlite3"
    preBuildScripts:
      - name: Compile Kotlin Multiplatform DawnChatShared Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ "${SKIP_KMP_GRADLE_BUILD:-false}" = "true" ]; then
            echo "Skipping Gradle KMP build because SKIP_KMP_GRADLE_BUILD=true"
            exit 0
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
    postCompileScripts:
      - name: Ensure AppIcon Asset Catalog and Fallback PNGs in App Bundle
        basedOnDependencyAnalysis: false
        script: |
          APP_BUNDLE="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          ICONSET_DIR="${SRCROOT}/iosApp/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$APP_BUNDLE"

          # If Assets.car was not generated by Xcode's AssetCatalog compiler, compile it explicitly
          if [ ! -f "$APP_BUNDLE/Assets.car" ] && [ -d "${SRCROOT}/iosApp/Assets.xcassets" ]; then
            ACTOOL_PLIST="${DERIVED_FILE_DIR}/assetcatalog_generated_info.plist"
            xcrun actool "${SRCROOT}/iosApp/Assets.xcassets" \
              --compile "$APP_BUNDLE" \
              --platform iphoneos \
              --minimum-deployment-target "${IPHONEOS_DEPLOYMENT_TARGET:-16.0}" \
              --target-device iphone \
              --target-device ipad \
              --app-icon AppIcon \
              --include-all-app-icons \
              --output-partial-info-plist "$ACTOOL_PLIST" \
              --compress-pngs
          fi

          # Also copy standalone PNG icon files to bundle root so App Store Connect validation
          # always finds 120x120, 180x180, 152x152, and 167x167 icons even outside Assets.car
          if [ -d "$ICONSET_DIR" ]; then
            cp -f "$ICONSET_DIR/Icon-60@2x.png" "$APP_BUNDLE/AppIcon60x60@2x.png"
            cp -f "$ICONSET_DIR/Icon-60@3x.png" "$APP_BUNDLE/AppIcon60x60@3x.png"
            cp -f "$ICONSET_DIR/Icon-76.png" "$APP_BUNDLE/AppIcon76x76~ipad.png"
            cp -f "$ICONSET_DIR/Icon-76@2x.png" "$APP_BUNDLE/AppIcon76x76@2x~ipad.png"
            cp -f "$ICONSET_DIR/Icon-83.5@2x.png" "$APP_BUNDLE/AppIcon83.5x83.5@2x~ipad.png"
          fi
