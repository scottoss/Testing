name: DawnChat
options:
  bundleIdPrefix: com.chillboiostudios
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

targets:
  DawnChat:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_NAME: DawnChat
        PRODUCT_BUNDLE_IDENTIFIER: com.chillboiostudios.dawnchat
        MARKETING_VERSION: 0.0.8
        CURRENT_PROJECT_VERSION: "20261019215500"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/bin/iosArm64/releaseFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosArm64/debugFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(PROJECT_DIR)/../shared/build/bin/iosX64/debugFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "DawnChatShared"
          - "-lsqlite3"
    preBuildScripts:
      - name: Compile Kotlin Multiplatform DawnChatShared Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ "${SKIP_KMP_GRADLE_BUILD:-false}" = "true" ]; then
            echo "Skipping Gradle KMP build because SKIP_KMP_GRADLE_BUILD=true"
            exit 0
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=2g" \
            -Pkotlin.native.jvmArgs="-Xmx8g -XX:MaxMetaspaceSize=2g"
    postCompileScripts:
      - name: Ensure AppIcon Asset Catalog and Timestamp Build Code in App Bundle
        basedOnDependencyAnalysis: false
        script: |
          APP_BUNDLE="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          ICONSET_DIR="${SRCROOT}/iosApp/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$APP_BUNDLE"

          # Always stamp CFBundleVersion with a UTC date+timestamp string number
          if [ "${SKIP_KMP_GRADLE_BUILD:-false}" = "true" ] && [ -n "${CURRENT_PROJECT_VERSION:-}" ] && [ "${CURRENT_PROJECT_VERSION}" != "1" ]; then
            BUILD_TIMESTAMP="${CURRENT_PROJECT_VERSION}"
          else
            BUILD_TIMESTAMP="$(date -u +"%Y%m%d%H%M%S")"
          fi
          if [ -f "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_TIMESTAMP}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" || true
          fi

          # If Assets.car was not generated by Xcode's AssetCatalog compiler, compile it explicitly for iPhone
          if [ ! -f "$APP_BUNDLE/Assets.car" ] && [ -d "${SRCROOT}/iosApp/Assets.xcassets" ]; then
            ACTOOL_PLIST="${DERIVED_FILE_DIR}/assetcatalog_generated_info.plist"
            xcrun actool "${SRCROOT}/iosApp/Assets.xcassets" \
              --compile "$APP_BUNDLE" \
              --platform iphoneos \
              --minimum-deployment-target "${IPHONEOS_DEPLOYMENT_TARGET:-15.0}" \
              --target-device iphone \
              --app-icon AppIcon \
              --include-all-app-icons \
              --output-partial-info-plist "$ACTOOL_PLIST" \
              --compress-pngs
          fi

          # Copy standalone iPhone PNG icon files to bundle root so App Store Connect validation
          # always finds 120x120 and 180x180 icons even outside Assets.car
          if [ -d "$ICONSET_DIR" ]; then
            cp -f "$ICONSET_DIR/Icon-60@2x.png" "$APP_BUNDLE/AppIcon60x60@2x.png"
            cp -f "$ICONSET_DIR/Icon-60@3x.png" "$APP_BUNDLE/AppIcon60x60@3x.png"
          fi
