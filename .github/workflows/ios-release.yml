name: iOS Build, Sign & App Store Upload

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Marketing version (CFBundleShortVersionString)'
        required: false
        default: '0.0.8'
        type: string
      upload_to_app_store:
        description: 'Automatically upload signed .ipa to App Store Connect / TestFlight'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-release:
    name: Build, Sign & Upload iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21 for Kotlin Multiplatform Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache Kotlin Native (~/.konan) toolchain & dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Validate required Apple signing & App Store Connect secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROV_PROFILE_BASE64: ${{ secrets.IOS_PROV_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          UPLOAD_TO_APP_STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store || 'true' }}
        run: |
          missing=()
          for secret_name in APPLE_TEAM_ID; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ -z "$IOS_DIST_CERT_BASE64" ] || [ -z "$IOS_PROV_PROFILE_BASE64" ]; then
            echo "Notice: IOS_DIST_CERT_BASE64 / IOS_PROV_PROFILE_BASE64 not set; falling back to Automatic Signing with App Store Connect API Key."
          fi

          if [ "$UPLOAD_TO_APP_STORE" = "true" ]; then
            for asc_secret in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
              if [ -z "${!asc_secret}" ]; then
                missing+=("$asc_secret")
              fi
            done
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Error: Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Compile KMP framework, sign iOS app, and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.chillboiostudios.dawnchat' }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '0.0.8' }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROV_PROFILE_BASE64: ${{ secrets.IOS_PROV_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          UPLOAD_TO_APP_STORE: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store || 'true' }}
        run: |
          export BUILD_NUMBER="$(date -u +"%Y%m%d%H%M%S")"
          echo "Using timestamp build code: $BUILD_NUMBER"
          chmod +x scripts/build_and_upload_ios.sh
          ./scripts/build_and_upload_ios.sh

      - name: Upload signed .ipa artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: DawnChat-iOS-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload dSYM crash symbols artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DawnChat-iOS-dSYMs
          path: build/ios/DawnChat.xcarchive/dSYMs
          if-no-files-found: warn
