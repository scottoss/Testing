name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Firebase for checks
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

  package:
    name: Build ${{ matrix.variant }} ${{ matrix.variant == 'debug' && 'APK' || 'signed AAB' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || '["debug", "release"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Configure Firebase for build
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json without replacing it."
          elif [ "$BUILD_VARIANT" = "release" ]; then
            if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "Set the ANDROID_GOOGLE_SERVICES_JSON_BASE64 repository secret for release builds." >&2
              exit 1
            fi
            printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Prepare release signing key
        if: ${{ matrix.variant == 'release' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/dawnchat-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build APK or signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.variant }}" = "debug" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            ./gradlew --no-daemon bundleRelease
          fi

      - name: Upload debug APK artifact
        if: ${{ matrix.variant == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: DawnChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed AAB artifact
        if: ${{ matrix.variant == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: DawnChat-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  release:
    name: Create release from Android artifacts
    if: ${{ inputs.publish_release }}
    needs: [quality, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release-assets/ \;
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No signed Android artifacts were collected" >&2
            exit 1
          fi

      - name: Create GitHub release
        run: |
          version=$(grep -E "versionName\s*=\s*\"" app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "0.0.0")
          tag="v${version}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
